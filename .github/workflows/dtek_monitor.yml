name: DTEK Dnipro Outage Monitor

on:
schedule:
# Запуск кожні 15 хвилин (для публічного репозиторію — безкоштовно і без лімітів).
# Якщо репозиторій приватний, замініть '/15' на '/25', щоб вкластися в 2000 хв/міс.
- cron: '*/15 * * * *'
workflow_dispatch:
repository_dispatch:
types: [check-dtek]

concurrency:
group: dtek-monitor-run
cancel-in-progress: false

permissions:
contents: write

jobs:
check-dtek:
runs-on: ubuntu-latest
timeout-minutes: 5

steps:
  - name: Завантаження коду репозиторію
    uses: actions/checkout@v4

  - name: Підключення гілки збереження стану (bot-state)
    run: |
      mkdir -p state
      if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
        git fetch origin bot-state
        git show origin/bot-state:state.json > state/state.json 2>/dev/null || echo "{}" > state/state.json
      else
        echo "{}" > state/state.json
      fi

  - name: Налаштування Python 3.12
    uses: actions/setup-python@v5
    with:
      python-version: '3.12'
      cache: 'pip'

  - name: Встановлення залежностей Python
    run: pip install -r requirements.txt

  - name: Кешування браузера Chromium (Playwright)
    id: playwright-cache
    uses: actions/cache@v4
    with:
      path: ~/.cache/ms-playwright
      key: playwright-chromium-\({{ runner.os }}-\){{ hashFiles('requirements.txt') }}

  - name: Встановлення Chromium для Playwright
    run: |
      if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
        playwright install chromium
      fi
      playwright install-deps chromium

  - name: Запуск перевірки сайту ДТЕК
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DTEK_CITY: ${{ secrets.DTEK_CITY || 'м. Дніпро' }}
      DTEK_STREET: ${{ secrets.DTEK_STREET || 'пров. Добровольців' }}
      DTEK_HOUSE: ${{ secrets.DTEK_HOUSE || '10' }}
      STATE_FILE: state/state.json
      TUYA_API_REGION: ${{ secrets.TUYA_API_REGION }}
      TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
      TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
      TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
    run: python dtek_monitor.py

  - name: Збереження оновленого стану в гілку bot-state
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      WORKTREE_DIR=$(mktemp -d)
      if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
        git fetch origin bot-state
        git worktree add "$WORKTREE_DIR" origin/bot-state
        git -C "$WORKTREE_DIR" checkout -B bot-state
      else
        git worktree add --orphan -b bot-state "$WORKTREE_DIR"
      fi

      cp state/state.json "$WORKTREE_DIR/state.json"

      cd "$WORKTREE_DIR"
      git add state.json
      if [ -n "$(git status --porcelain)" ]; then
        git commit -m "chore: update dtek state"
        git push origin bot-state
      else
        echo "Стан не змінився — коміт не потрібен."
      fi
