name: Build D10 Svitlo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/generate_app.py'
      - '.github/workflows/build_android_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate native Android project
        run: python android/generate_app.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: android_build
        run: gradle assembleDebug --no-daemon

      - name: Prepare d10-svitlo.apk
        run: cp android_build/app/build/outputs/apk/debug/app-debug.apk d10-svitlo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: d10-svitlo-apk
          path: d10-svitlo.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk d10-svitlo.apk --clobber
          else
            gh release create latest-apk d10-svitlo.apk \
              --title "Д10 Світло — Android APK" \
              --notes "Нативний Android-додаток моніторингу світла для м. Дніпро, пров. Добровольців, 10. Скачайте файл d10-svitlo.apk та встановіть на смартфон."
          fi
  
